name: Build iOS 27 openGym unsigned IPA

on:
  workflow_dispatch:
  # Build the draft iOS customization once the changes are proposed. The original
  # manually dispatched release build on main remains separate until merge.
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios-ipa.yml'

concurrency:
  group: ios27-unsigned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-unsigned-ipa:
    name: Build ${{ matrix.variant }} iPhone IPA (Xcode 27)
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        variant: [ui-only, healthkit-read]
    timeout-minutes: 90

    steps:
      - name: Checkout openGym customization source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Xcode 27 Apple toolchain
        run: |
          xcodebuild -version
          pod --version
          node --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build offline-capable mobile assets and sync iOS project
        working-directory: frontend
        run: npm run build:mobile

      - name: Archive iOS app without signing
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./frontend/package.json').version")"
          BUILD="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' frontend/android/app/build.gradle | head -n 1)"
          if [[ -z "$VERSION" || -z "$BUILD" ]]; then
            echo 'Cannot determine openGym app version and build number.' >&2
            exit 1
          fi
          echo "App version: $VERSION / build $BUILD"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Only the separate Health test variant adds HealthKit entitlement and
          # compiles the user-initiated READ-ONLY import methods. In particular,
          # the UI-only IPA stays installable with profiles lacking HealthKit.
          EXTRA_SETTINGS=("CODE_SIGN_ENTITLEMENTS=")
          if [[ "${{ matrix.variant }}" == "healthkit-read" ]]; then
            EXTRA_SETTINGS=("CODE_SIGN_ENTITLEMENTS=App/HealthKitRead.entitlements" "SWIFT_ACTIVE_COMPILATION_CONDITIONS=HEALTHKIT_IMPORT_ENABLED")
          fi
          xcodebuild \
            -workspace frontend/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/openGym.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${EXTRA_SETTINGS[@]}" \
            archive

      - name: Package unsigned IPA and SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/openGym.xcarchive/Products/Applications/App.app"
          if [[ ! -d "$APP" ]]; then
            echo "Missing archived app: $APP" >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$RUNNER_TEMP/openGymPkg/Payload" "$OUT"
          ditto "$APP" "$RUNNER_TEMP/openGymPkg/Payload/App.app"
          IPA="openGym-${APP_VERSION}-unsigned.ipa"
          if [[ "${{ matrix.variant }}" == "healthkit-read" ]]; then
            IPA="openGym-${APP_VERSION}-healthkit-read-unsigned.ipa"
          fi
          (cd "$RUNNER_TEMP/openGymPkg" && ditto -c -k --keepParent Payload "$OUT/$IPA")
          unzip -tq "$OUT/$IPA"
          (cd "$OUT" && shasum -a 256 "$IPA" > "$IPA.sha256")
          ls -lh "$OUT"

      - name: Upload unsigned IPA for signing in 全能签
        uses: actions/upload-artifact@v4
        with:
          name: openGym-iOS27-${{ matrix.variant }}-unsigned-IPA
          path: artifacts/openGym-*-unsigned.ipa*
          if-no-files-found: error
          retention-days: 30
